<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042017"/>
      <stop offset="100%" stop-color="#02120d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Ornate Star of Al-Quds / Islamic Octagram -->
  <g transform="translate(256, 256)">
    <!-- First Square -->
    <rect x="-140" y="-140" width="280" height="280" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>
    <!-- Second Rotated Square -->
    <rect x="-140" y="-140" width="280" height="280" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="8" transform="rotate(45)" opacity="0.6"/>

    <!-- Concentric Circle -->
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>

    <!-- Center Holy Quran Symbol on Rehal Stand -->
    <!-- Open Book Pages -->
    <path d="M -80 -25 C -40 -45, -10 -20, 0 10 C 10 -20, 40 -45, 80 -25 L 80 55 C 40 35, 10 55, 0 75 C -10 55, -40 35, -80 55 Z" fill="url(#goldGrad)"/>
    <!-- Book Spine & Rehal Legs -->
    <path d="M 0 10 L 0 85 M -45 65 L -75 105 M 45 65 L 75 105" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

    <!-- Crescent Moon and Star Crest Above -->
    <path d="M 0 -85 A 24 24 0 1 0 22 -65 A 20 20 0 1 1 0 -85 Z" fill="#fbbf24"/>
  </g>
</svg>
